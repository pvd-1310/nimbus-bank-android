services:
  backend:
    build:
      context: ../backend
    image: final-term-backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-admin.json
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ${FIREBASE_ADMIN_KEY_PATH:?Set FIREBASE_ADMIN_KEY_PATH to the absolute path of the Firebase Admin JSON}:/run/secrets/firebase-admin.json:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
